name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagged Version'
        required: true

jobs:
  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      config: release

  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      config: release

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage archives under the release tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          archives=(artifacts/*/*.tar.gz artifacts/*/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no build archives found under artifacts/" >&2
            exit 1
          fi
          for f in "${archives[@]}"; do
            base="$(basename "$f")"
            name="${base%%.*}"
            ext="${base#*.}"
            cp "$f" "release/${name}-${TAG}.${ext}"
          done
          ls -l release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Release: ${{ github.event.inputs.tag }}"
          prerelease: true
          files: release/*
