name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagged Version'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools, Shaderc
          vulkan-use-cache: true
      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DAMNESIA_GAME_DIRECTORY=''
          -DAMNESIA_TDD_VERSION="${{ github.event.inputs.tag }}"
      - name: Build
        run: msbuild build\ALL_BUILD.vcxproj /property:Configuration=Release /m
      - name: Zipping (Windows)
        shell: pwsh
        run: |
          cd build
          7z a Amnesia_windows_x86_64_${{ github.event.inputs.tag }}.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-artifacts
          path: build/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip \
            libx11-dev libxft-dev libxext-dev libxi-dev libxmu-dev \
            mesa-common-dev libgl-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgtk-3-dev libasound2-dev libpulse-dev \
            libvulkan-dev
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools, Shaderc
          vulkan-use-cache: true
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMNESIA_GAME_DIRECTORY='' \
            -DAMNESIA_TDD_VERSION="${{ github.event.inputs.tag }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Zipping
        run: |
          cd build
          zip -r Amnesia_linux_x86_64_${{ github.event.inputs.tag }}.zip amnesia
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifacts
          path: build/*.zip

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-build-artifacts
          path: ${{ github.workspace }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-build-artifacts
          path: ${{ github.workspace }}
      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ github.event.inputs.tag }}
          prerelease: true
          title: "Release: ${{ github.event.inputs.tag }}"
          files: |
            ${{ github.workspace }}/*.zip
